name: CI and Automated Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite & Linting
    runs-on: ubuntu-latest
    # Explicit local/test configuration; do not reuse these values in production.
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-production-abcdefghijklmnopqrstuvwxyz123456"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        run: |
          python manage.py check

      - name: Run Database Migrations
        run: |
          python manage.py migrate

      - name: Run Acceptance & Unit Tests (TC-01 through TC-18)
        run: |
          python manage.py test --verbosity=2
