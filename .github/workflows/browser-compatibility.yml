name: Browser Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-compatibility:
    name: Chrome and Firefox Workflow Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-production-abcdefghijklmnopqrstuvwxyz123456"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      RUN_BROWSER_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.50,<2"

      - name: Install current Chrome Stable and Firefox
        run: python -m playwright install --with-deps --force chrome firefox

      - name: Check Django configuration
        run: python manage.py check

      - name: Run cross-browser workflow tests
        run: python manage.py test tests.test_browser_compatibility --verbosity=2
